name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 修复 Windows SDK (10.0.19041.0)
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        Write-Host "=== 修复 Windows SDK 版本 ==="
        $sdk = "10.0.19041.0"
        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
          $file = $_.FullName
          (Get-Content $file) `
            -replace "<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>",
                     "<WindowsTargetPlatformVersion>$sdk</WindowsTargetPlatformVersion>" `
            | Set-Content $file
          Write-Host "修复: $file"
        }

    - name: 查找 SLN
      id: sln
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { Write-Error "未找到 CoreGameServer.sln"; exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
