name: Build GameServer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 修复 Windows SDK
    - name: Fix Windows SDK
      shell: powershell
      run: |
        $sdk = "10.0.19041.0"
        Write-Host "Fixing SDK to $sdk"

        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
          $file = $_.FullName
          $xml = [xml](Get-Content $file -Raw)

          $updated = $false
          foreach ($pg in $xml.Project.PropertyGroup) {
            foreach ($node in $pg.ChildNodes) {
              if ($node.Name -eq "WindowsTargetPlatformVersion") {
                $node.InnerText = $sdk
                $updated = $true
              }
            }
          }

          if ($updated) {
            $xml.Save($file)
            Write-Host "Updated SDK in $file"
          } else {
            Write-Host "No SDK tag in $file"
          }
        }

    - name: Find SLN
      id: sln
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { Write-Error "SLN not found"; exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT
        Write-Host "Found SLN: $($sln.FullName)"

    # 用你的 VS2022 加载 MSVC 编译环境
    - name: Load VS Environment
      shell: cmd
      run: |
        echo ==== Loading vcvarsall ====
        call "I:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" x86

    # 编译
    - name: Build Debug Win32
      shell: cmd
      run: |
        echo ==== Starting MSBuild ====
        "I:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe" ^
          "${{ steps.sln.outputs.file }}" ^
          /t:Rebuild ^
          /p:Configuration=Debug ^
          /p:Platform=Win32 ^
          /p:PlatformToolset=v143 ^
          /m

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
