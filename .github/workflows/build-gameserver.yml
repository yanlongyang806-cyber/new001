name: 编译项目
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSVC 14.34 工具集
        shell: cmd
        run: |
          # 使用 Chocolatey 安装 Visual Studio Build Tools 2022，并指定 14.34 工具集
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --version 17.4.4"
          # 等待安装完成（Chocolatey 安装后可能需要手动刷新环境）
          refreshenv

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: "14.34"  # 此时环境已安装 14.34，可正常配置

      - name: 编译项目
        run: msbuild CoreGameServer.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64
