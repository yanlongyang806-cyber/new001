name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装 MSVC v143
      uses: actions/setup-vs@v2
      with:
        vs-version: latest

    - name: 初始化 MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 查找解决方案
      id: sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: pwsh
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
