name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # 必须使用 VS2022 + 可用 SDK 的镜像

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化 VS2022（v143 工具集）
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 143

    - name: 自动修复所有项目的 Windows SDK 版本
      shell: pwsh
      run: |
        Write-Host "=== 自动修复 Windows SDK 版本 ==="
        $sdk = "10.0.20348.0"
        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
          $file = $_.FullName
          Write-Host "修复: $file"
          
          (Get-Content $file) `
            -replace "<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>", "<WindowsTargetPlatformVersion>$sdk</WindowsTargetPlatformVersion>" `
            | Set-Content $file
        }

    - name: 查找解决方案
      id: sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { Write-Error "未找到 CoreGameServer.sln"; exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: pwsh
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
