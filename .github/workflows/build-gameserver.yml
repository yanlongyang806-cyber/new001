    - name: Copy StructParser Tools
      shell: powershell
      run: |
        $src = "I:\gp5\Utilities\Bin"
        $dst = "$env:RUNNER_TEMP"

        Write-Host "Copy tools from $src to $dst"

        Copy-Item "$src\StructParser.exe" -Destination $dst -Force
        Copy-Item "$src\ProjectManager.exe" -Destination $dst -Force
        Copy-Item "$src\structparser_settings.txt" -Destination $dst -Force

        Write-Host "Copied StructParser + ProjectManager OK"
