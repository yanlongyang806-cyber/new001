name: Build GameServer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 自动寻找 VS2022 工具链路径
    - name: Detect Visual Studio Paths
      id: vs
      shell: powershell
      run: |
        $vsPaths = @(
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
          "C:\Program Files\Microsoft Visual Studio\2022\Professional",
          "C:\Program Files\Microsoft Visual Studio\2022\Community"
        )

        foreach ($p in $vsPaths) {
          if (Test-Path "$p\VC\Auxiliary\Build\vcvarsall.bat") {
            Write-Host "Found VS at $p"
            echo "vcvars=$p\VC\Auxiliary\Build\vcvarsall.bat" >> $env:GITHUB_OUTPUT
            echo "msbuild=$p\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_OUTPUT
            exit 0
          }
        }

        Write-Error "FATAL: 未找到 Visual Studio 2022 的安装路径！"

    # 修复 Windows SDK
    - name: Fix Windows SDK
      shell: powershell
      run: |
        $sdk = "10.0.19041.0"
        Write-Host "Fixing SDK version to $sdk"
        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $file = $_.FullName
            $content = Get-Content $file -Raw
            $xml = [xml]$content
            $updated = $false
            foreach ($pg in $xml.Project.PropertyGroup) {
                foreach ($node in $pg.ChildNodes) {
                    if ($node.Name -eq "WindowsTargetPlatformVersion") {
                        $node.InnerText = $sdk
                        $updated = $true
                    }
                }
            }
            if ($updated) { $xml.Save($file) }
        }

    - name: Locate Solution
      id: sln
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { Write-Error "未找到 CoreGameServer.sln"; exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    # 真实自动可执行的构建步骤
    - name: Build Debug Win32
      shell: cmd
      run: |
        echo ==== Load MSVC Environment ====
        call "${{ steps.vs.outputs.vcvars }}" x86

        echo ==== MSBuild Start ====
        "${{ steps.vs.outputs.msbuild }}" ^
          "${{ steps.sln.outputs.file }}" ^
          /t:Rebuild ^
          /p:Configuration=Debug ^
          /p:Platform=Win32 ^
          /p:PlatformToolset=v143 ^
          /m

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
