name: Build GameServer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 解决 Runner 服务账号执行策略问题（关键补丁）
    - name: 强制解除执行策略（适配 NETWORK SERVICE）
      shell: cmd
      run: |
        powershell -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy Bypass -Scope Process -Force"
        powershell -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy Bypass -Scope CurrentUser -Force"
        powershell -ExecutionPolicy Bypass -Command "Write-Host 'ExecutionPolicy 已解除'"

    - name: 修复所有项目 SDK（10.0.19041.0）
      shell: powershell -ExecutionPolicy Bypass
      run: |
        Write-Host "=== 修复 Windows SDK 版本 ==="
        $sdk = "10.0.19041.0"
        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
          $file = $_.FullName
          (Get-Content $file) `
            -replace "<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>",
                     "<WindowsTargetPlatformVersion>$sdk</WindowsTargetPlatformVersion>" `
            | Set-Content $file
          Write-Host "修复: $file"
        }

    - name: 查找 SLN
      id: sln
      shell: powershell -ExecutionPolicy Bypass
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { Write-Error "未找到 CoreGameServer.sln"; exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: powershell -ExecutionPolicy Bypass
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
