name: Build GameServer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Remove execution policy restrictions
    - name: Allow PowerShell scripts
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy Bypass -Scope Process -Force"
        powershell -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy Bypass -Scope CurrentUser -Force"
        Write-Host "ExecutionPolicy OK"

    # Fix SDK version
    - name: Fix Windows SDK (10.0.19041.0)
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -Command "
          Write-Host 'Fixing SDK versions...';
          $sdk = '10.0.19041.0';
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $file = $_.FullName;
            (Get-Content $file) `
              -replace '<WindowsTargetPlatformVersion>.*?</WindowsTargetPlatformVersion>',
                       "<WindowsTargetPlatformVersion>$sdk</WindowsTargetPlatformVersion>" `
              | Set-Content $file;
            Write-Host ('Fixed: ' + $file);
          }
        "

    # Find solution
    - name: Find SLN
      id: sln
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -Command "
          $sln = Get-ChildItem -Recurse -Filter 'CoreGameServer.sln' | Select-Object -First 1;
          if (-not $sln) { Write-Error 'CoreGameServer.sln not found'; exit 1 };
          echo ('file=' + $sln.FullName) >> $env:GITHUB_OUTPUT;
        "

    # Build
    - name: Build Debug Win32
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -Command "
          msbuild `
            '${{ steps.sln.outputs.file }}' `
            /t:Rebuild `
            /p:Configuration=Debug `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m;
        "

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
