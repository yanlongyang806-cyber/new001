name: Build GameServer Win32 Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build CoreGameServer (Win32 Debug)
      shell: pwsh
      run: |
        Write-Host "=== Building CoreGameServer Win32 Debug ==="
        MSBuild.exe "Core/GameServer/CoreGameServer.sln" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /m
