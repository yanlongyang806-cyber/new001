name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 安装 Visual Studio + MSVC
      uses: microsoft/setup-vs@v1
      with:
        vs-version: "2022"
        components: "Microsoft.VisualStudio.Component.VC.Tools.x86.x64;Microsoft.VisualStudio.Component.Windows10SDK.19041"

    - name: 设置 MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: 查找 sln
      id: sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: pwsh
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
