name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2019   # ← 关键！不要用 windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化 v142 工具链（VS2019）
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 142

    - name: 调试环境
      shell: pwsh
      run: |
        Write-Host "VCToolsVersion = $env:VCToolsVersion"
        cl.exe
        msbuild -version

    - name: 查找解决方案
      id: sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) {
          Write-Error "未找到 CoreGameServer.sln"
          exit 1
        }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: pwsh
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v142 `
          /m

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
