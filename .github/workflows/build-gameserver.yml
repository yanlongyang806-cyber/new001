- name: Repair broken PreBuildEvent XML (FULL FIX)
  shell: powershell
  run: |
    Write-Host "=== Repairing broken PreBuildEvent XML across all vcxproj ==="

    Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
      $file = $_.FullName
      $xml = Get-Content $file -Raw -Encoding UTF8
      
      $orig = $xml

      # 1. 删除所有 <Project> 下的孤立 PreBuildEvent
      $xml = $xml -replace '(?s)<Project>[\s\r\n]*<PreBuildEvent>.*?</PreBuildEvent>', '<Project>'

      # 2. 删除所有不在 ItemDefinitionGroup 里的 PreBuildEvent
      $xml = $xml -replace '(?s)(</ImportGroup>)(\s*<PreBuildEvent>.*?</PreBuildEvent>)', '$1'

      # 3. 如果项目没有 PreBuildEvent，则补到正确位置
      if ($xml -notmatch '<PreBuildEvent>') {
        # 加一个空的，防止构建器报缺少节点
        $xml = $xml -replace '(</ItemDefinitionGroup>)', "`n    <PreBuildEvent></PreBuildEvent>`n$1"
      }

      if ($xml -ne $orig) {
        Write-Host "✔ Fixed PreBuildEvent structure: $file"
        Set-Content -Path $file -Value $xml -Encoding UTF8 -NoNewline
      }
    }
