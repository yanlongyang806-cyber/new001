name: Build GameServer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 初始化 VS2022 环境（v143 工具集）
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: v143   # ← 不要写 14.34

    - name: 调试 - 环境信息
      shell: pwsh
      run: |
        Write-Host "VCToolsVersion = $env:VCToolsVersion"
        Write-Host "VCINSTALLDIR = $env:VCINSTALLDIR"
        cl.exe
        msbuild -version

    - name: 找到 CoreGameServer.sln
      id: find_sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) {
          Write-Error "找不到 CoreGameServer.sln"
          exit 1
        }
        echo "sln=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 GameServer (Debug Win32)
      shell: pwsh
      run: |
        $solutionPath = "${{ steps.find_sln.outputs.sln }}"
        Write-Host "开始编译: $solutionPath"
        
        msbuild `
          "$solutionPath" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m `
          /v:minimal

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug-Win32
        path: |
          **/bin/Debug/
          **/Debug/*.exe
          **/Debug/*.dll
        retention-days: 7

    - name: 列出构建输出
      if: always()
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Include *.exe, *.dll | 
        Where-Object { $_.FullName -match 'Debug' } |
        Select-Object FullName, Length
