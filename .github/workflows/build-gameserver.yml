name: Build GameServer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # ← 必须改成这个！

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化 VS2022 + v143 工具链
      uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: 143    # ← 不要带 v

    - name: 调试环境
      shell: pwsh
      run: |
        Write-Host "VCToolsVersion = $env:VCToolsVersion"
        Write-Host "VCINSTALLDIR   = $env:VCINSTALLDIR"
        cl.exe
        msbuild -version

    - name: 查找解决方案
      id: sln
      shell: pwsh
      run: |
        $sln = Get-ChildItem -Recurse -Filter "CoreGameServer.sln" | Select-Object -First 1
        if (-not $sln) { exit 1 }
        echo "file=$($sln.FullName)" >> $env:GITHUB_OUTPUT

    - name: 编译 Win32 Debug
      shell: pwsh
      run: |
        msbuild `
          "${{ steps.sln.outputs.file }}" `
          /t:Rebuild `
          /p:Configuration=Debug `
          /p:Platform=Win32 `
          /p:PlatformToolset=v143 `
          /m

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: GameServer-Debug
        path: |
          **/Debug/*.exe
          **/Debug/*.dll
